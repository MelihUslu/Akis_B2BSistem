name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: akis
          POSTGRES_PASSWORD: akis
          POSTGRES_DB: akis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akis -d akis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Canlıya giden paketlerde bilinen açık: kritik olan derlemeyi durdurur. xlsx (yüksek, npm'de düzeltmesi yok)
      # SheetJS 0.20.3'e geçince eşik --audit-level=high yapılır (docs/yapilanlar/12-guvenlik-denetimi.md)
      - name: Paket açığı taraması
        run: npm audit --omit=dev --audit-level=critical
      - run: npx prisma generate
      - name: Birim testleri
        run: npm test
      - name: Kiracı izolasyonu testleri
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://akis:akis@localhost:5432/akis_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Paket açığı taraması (tarayıcıya giden paketler)
        run: npm audit --omit=dev --audit-level=high
      - name: Derleme
        run: npx vite build
