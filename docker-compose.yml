services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-akis_b2b}
    volumes:
      - pgdata_saas:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Yerelden erişim (5432 başka bir projede kullanılıyor olabilir)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akis} -d ${POSTGRES_DB:-akis_b2b}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # İstek sınırlayıcı sayaçları (birden fazla backend örneği aynı sınırları paylaşsın diye)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules # Prevent host node_modules from overwriting container's
      - ./backups:/backups:ro # Sistem durumu sayfası son yedeği buradan okur
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-akis}:${POSTGRES_PASSWORD:-akis_dev_password}@db:5432/${POSTGRES_DB:-akis_b2b}
      - PORT=5001
      - REDIS_URL=redis://redis:6379
      - BACKUP_DIR=/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent host node_modules from overwriting container's
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

  # Günlük yedek: veritabanı (pg_dump) + yüklenen dosyalar → ./backups (BACKUP_KEEP_DAYS gün saklanır)
  backup:
    image: postgres:15-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-akis}
      PGPASSWORD: ${POSTGRES_PASSWORD:-akis_dev_password}
      PGDATABASE: ${POSTGRES_DB:-akis_b2b}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Istanbul
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
    # Açılışta bir yedek alır, sonra her gün 03:00'te (geliştirmede Google Drive kopyası yok; canlı: docker-compose.prod.yml)
    entrypoint: ["/bin/sh", "-c", "/scripts/backup.sh acilis; while true; do sleep $$(( ( $$(date -d 03:00 +%s 2>/dev/null || date +%s) + 86400 - $$(date +%s) ) % 86400 + 1 )); /scripts/backup.sh zamanli || echo '[yedek] HATA'; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata_saas: # (Eski "pgdata" volume'ü Mayıs 2026'dan kalma bir denemeye ait, kullanılmıyor)
