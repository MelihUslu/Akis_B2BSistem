# Canlı ortam. Kullanım (sunucuda, proje klasöründe):
#   cp deploy/production.env.example .env          # compose değişkenleri (alan adı, veritabanı şifresi…)
#   cp deploy/backend.production.env.example backend/.env.production   # backend ayarları
#   docker compose -f docker-compose.prod.yml up -d --build
# Ayrıntı: docs/canliya-cikis.md

# Kayıt dosyaları döndürülür (servis başına en fazla 5 × 20 MB): Docker varsayılanında sınırsız büyür; veritabanı
# kesintisi gibi bir hata yağmurunda sunucunun diski dolabilirdi (dayanıklılık testi, 5 Kasım 2026).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı değil (.env)}
      POSTGRES_DB: ${POSTGRES_DB:-akis_b2b}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # Port dışarı açılmaz; yalnızca iç ağdan erişilir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akis} -d ${POSTGRES_DB:-akis_b2b}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    logging: *logging
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always

  backend:
    logging: *logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/server.js"]
    env_file: ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-akis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-akis_b2b}
      REDIS_URL: redis://redis:6379
      BACKUP_DIR: /backups
      # Çalışan sürüm (Platform → Sistem Durumu'nda güncelleme kontrolü için). Dağıtımda git etiketinden verilir:
      #   APP_VERSION=$(git describe --tags --always) docker compose -f docker-compose.prod.yml up -d --build
      APP_VERSION: ${APP_VERSION:-}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  web:
    logging: *logging
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: https://api.${ROOT_DOMAIN:?ROOT_DOMAIN tanımlı değil (.env)}/api
        VITE_ROOT_DOMAIN: ${ROOT_DOMAIN}
        VITE_PLATFORM_NAME: ${PLATFORM_NAME:-Akis B2B}
        VITE_SUPPORT_PHONE: ${SUPPORT_PHONE:-}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        # Platform (developer) girişi CAPTCHA'sı — Cloudflare Turnstile site anahtarı (backend'de TURNSTILE_SECRET ile birlikte)
        VITE_TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL tanımlı değil (.env) — sertifika uyarıları için}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: always

  # Günlük yedek: açılışta bir kez, sonra her gün BACKUP_TIME'da (03:00, bayilerin çalışmadığı saat) → ./backups
  # (BACKUP_KEEP_DAYS gün) ve kuruluysa Google Drive'a şifreli kopya (bir kez: scripts/drive-setup.sh; rclone ayarı
  # ./rclone'da). Her çalışmanın kaydı: Platform → Yedekler
  backup:
    logging: *logging
    build:
      context: ./deploy
      dockerfile: Dockerfile.backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-akis}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-akis_b2b}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_DRIVE_KEEP_DAYS: ${BACKUP_DRIVE_KEEP_DAYS:-30}
      BACKUP_DRIVE_KEEP_MONTHS: ${BACKUP_DRIVE_KEEP_MONTHS:-12}
      BACKUP_POST_CMD: ${BACKUP_POST_CMD:-}
      RCLONE_CONFIG: /config/rclone.conf
      TZ: Europe/Istanbul
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
      - ./rclone:/config
    entrypoint: ["/bin/sh", "-c", "/scripts/backup.sh acilis; while true; do sleep $$(( ( $$(date -d \"$$BACKUP_TIME\" +%s 2>/dev/null || date +%s) + 86400 - $$(date +%s) ) % 86400 + 1 )); /scripts/backup.sh zamanli || echo '[yedek] HATA'; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata_prod:
  caddy_data:   # sertifikalar — silinirse yeniden alınır (Let's Encrypt sınırlarına dikkat)
  caddy_config:
